# Copy this file to .github/workflows/governance.yml in an adopted project.
# This template assumes the isolated layout (sdd-gov/ under the project root).
name: governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install module dependencies
        run: python -m pip install pyyaml
      - name: Governance check
        run: sh sdd-gov/g check --budget
      - name: Governance selftest
        run: sh sdd-gov/g selftest
